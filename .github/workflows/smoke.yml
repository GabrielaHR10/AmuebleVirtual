name: smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NO_BROWSER: "1"
      NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: uv sync
        working-directory: backend
        run: uv sync

      - name: Tests rápidos
        working-directory: backend
        run: uv run pytest -q -m "not slow"

      - name: instalar.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\windows\instalar.bat

      - name: Arrancar servidor (Windows, iniciar.bat)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\windows\iniciar.bat' -WindowStyle Hidden

      - name: Arrancar servidor (Mac, iniciar.command)
        if: runner.os == 'macOS'
        run: nohup bash scripts/mac/iniciar.command > server.log 2>&1 &

      - name: GET /api/health
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health; then echo; echo "OK"; exit 0; fi
            sleep 2
          done
          echo "El servidor no respondió"; cat server.log 2>/dev/null || true
          exit 1

  # PLAN 7.1: arma el zip del release y lo prueba en un Windows limpio (instalar.bat instala uv y los modelos).
  build-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: crear_release.sh
        run: bash scripts/crear_release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/*.zip

  release-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: build-release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NO_BROWSER: "1"
      NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: samples/rooms
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Descomprimir
        shell: pwsh
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath rel
          $dir = Get-ChildItem rel | Select-Object -First 1
          "RELDIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: instalar.bat (sin uv preinstalado)
        shell: cmd
        run: call "%RELDIR%\scripts\windows\instalar.bat"
      - name: Arrancar iniciar.bat
        shell: pwsh
        run: Start-Process -FilePath cmd.exe -ArgumentList '/c', "`"$env:RELDIR\scripts\windows\iniciar.bat`"" -WindowStyle Hidden
      - name: Health, página y análisis de una foto
        shell: bash
        run: |
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          echo
          curl -sf http://127.0.0.1:8000/ | grep -q "Estudio Virtual"
          photo=$(ls samples/rooms/*.jpeg | head -1)
          curl -sf -F "file=@${photo}" http://127.0.0.1:8000/api/scenes | python -c "import json,sys; s=json.load(sys.stdin); print('escena', s['id'], 'altura cámara', s['camera_height_m']); assert s['floor']['found']"
